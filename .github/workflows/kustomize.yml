name: Kustomize

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  render:
    name: Render manifests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Render Kustomize overlays
        run: |
          set -euo pipefail

          for app in */kustomization.yaml; do
            app_dir="${app%/kustomization.yaml}"
            echo "Rendering ${app_dir}"
            kubectl kustomize "${app_dir}" --enable-helm >/tmp/"${app_dir}".yaml
          done
